<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Age Calculator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
      color: var(--accent-color);
      text-align: center;
    }

    .input-group {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input[type="date"] {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
    }

    .stats {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .planet-card {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .planet-name {
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .planet-age {
      font-size: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Planetary Age Calculator</h1>
    
    <div class="input-group">
      <label for="birthdate">Enter your Birthdate:</label>
      <input type="date" id="birthdate" value="2000-01-01">
    </div>

    <div class="stats" id="daysLived">Total Earth Days Lived: 0</div>

    <div class="grid" id="results"></div>
  </div>

  <script>
    const planetYearLengths = {
      "Mercury": 88,
      "Venus": 225,
      "Earth": 365,
      "Mars": 687,
      "Jupiter": 4380,
      "Saturn": 10767.5,
      "Uranus": 30660,
      "Neptune": 60152,
      "Pluto": 90520
    };

    const birthdateInput = document.getElementById('birthdate');
    const daysLivedEl = document.getElementById('daysLived');
    const resultsContainer = document.getElementById('results');

    function calculateAges() {
      const birthdateValue = birthdateInput.value;
      if (!birthdateValue) return;

      const birthdate = new Date(birthdateValue);
      const today = new Date();
      
      const diffTime = Math.max(0, today - birthdate);
      const daysLived = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      daysLivedEl.textContent = `Total Earth Days Lived: ${daysLived.toLocaleString()} days`;
      resultsContainer.innerHTML = '';

      for (const [planet, lengthInDays] of Object.entries(planetYearLengths)) {
        const age = (daysLived / lengthInDays).toFixed(2);

        const card = document.createElement('div');
        card.className = 'planet-card';
        card.innerHTML = `
          <div class="planet-name">${planet}</div>
          <div class="planet-age">${age} years old</div>
        `;
        resultsContainer.appendChild(card);
      }
    }

    birthdateInput.addEventListener('change', calculateAges);
    calculateAges();
  </script>

</body>
</html>
